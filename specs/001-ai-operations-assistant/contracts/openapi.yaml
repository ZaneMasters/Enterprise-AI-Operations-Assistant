openapi: 3.0.3
info:
  title: Enterprise AI Operations Assistant API
  description: API backend para asistente RAG empresarial con uso de herramientas y trazabilidad (Prueba Técnica I CLOUD SEVEN).
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      summary: Healthcheck del servicio
      operationId: getHealth
      responses:
        '200':
          description: Servicio saludable y operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  version:
                    type: string
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time
                  vectorstore_status:
                    type: string
                    example: "ready"

  /chat:
    post:
      summary: Endpoint principal de interacción con el asistente RAG (alias de /api/v1/query)
      operationId: chatAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 2000
                  example: "¿Cuáles son los requisitos de seguridad para actualizar la base de datos de producción?"
                session_id:
                  type: string
                  example: "sess-12345"
      responses:
        '200':
          description: Respuesta generada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  interaction_id:
                    type: string
                    format: uuid
                  query:
                    type: string
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        chunk_id:
                          type: string
                        snippet:
                          type: string
                  tools_used:
                    type: array
                    items:
                      type: object
                  duration_ms:
                    type: number
                  status:
                    type: string
                    enum: [SUCCESS, ABSTAINED, ERROR]
        '422':
          description: Error de validación de entrada

  /api/v1/query:
    post:
      summary: Realizar consulta al agente RAG con soporte de herramientas
      operationId: submitQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  minLength: 2
                  maxLength: 2000
                  example: "¿Cuáles son los requisitos de seguridad para actualizar la base de datos de producción?"
                session_id:
                  type: string
                  example: "sess-12345"
      responses:
        '200':
          description: Respuesta generada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  interaction_id:
                    type: string
                    format: uuid
                  query:
                    type: string
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        chunk_id:
                          type: string
                        snippet:
                          type: string
                  tools_used:
                    type: array
                    items:
                      type: object
                  duration_ms:
                    type: number
                  status:
                    type: string
                    enum: [SUCCESS, ABSTAINED, ERROR]
        '422':
          description: Error de validación de entrada

  /api/v1/documents:
    post:
      summary: Cargar e ingerir un documento en el vector store
      operationId: ingestDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                category:
                  type: string
                  default: "general"
      responses:
        '201':
          description: Documento indexado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc_id:
                    type: string
                  filename:
                    type: string
                  chunks_created:
                    type: integer
                  message:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        '400':
          description: Formato no soportado o archivo corrupto

  /api/v1/history:
    get:
      summary: Consultar historial de interacciones y trazas de auditoría
      operationId: getHistory
      parameters:
        - name: limit
          in: query
          description: Cantidad máxima de registros a retornar (orden cronológico descendente)
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Historial recuperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  interactions:
                    type: array
                    items:
                      type: object
